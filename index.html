<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일에서 화면 폭에 맞추고, 확대/축소로 화면이 흔들리지 않게 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>꽃순이네 테트리스</title>
  <!-- 제목용 동글동글한 한글 글꼴 (불러오지 못하면 기본 글꼴로 표시) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #111; color: #fff; font-family: sans-serif; margin: 0;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      touch-action: manipulation; /* 두 번 탭 확대 방지 */
      user-select: none; -webkit-user-select: none;
    }
    /* 상단 메인 제목 */
    #title {
      margin: 0 0 14px; padding: 0 12px; text-align: center;
      font-family: 'Jua', sans-serif; font-weight: normal;
      font-size: clamp(26px, 8vw, 44px); letter-spacing: 1px; line-height: 1.2;
      background: linear-gradient(90deg, #ff8fc7, #ffd36e, #8fe3ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #title .flower { color: initial; -webkit-text-fill-color: initial; }
    #game { display: flex; align-items: flex-start; }
    canvas { border: 2px solid #555; display: block; }
    /* 내부 해상도(300x600)는 그대로 두고, 화면에 보이는 크기만 줄임 */
    #board { height: min(600px, 65vh); width: auto; }
    #info { font-size: 20px; margin-left: 20px; }
    #info p { margin: 0 0 16px; }
    #info .label { color: #aaa; font-size: 14px; display: block; }
    #next { width: 120px; height: 120px; }
    #pause, #music {
      width: 120px; height: 40px; font-size: 15px; color: #fff; cursor: pointer;
      background: #2a2a2a; border: 1px solid #555; border-radius: 10px;
    }
    #keys { color: #aaa; font-size: 13px; line-height: 1.7; }

    /* 시작 화면 */
    #board-wrap { position: relative; }
    #menu {
      position: absolute; inset: 2px; background: rgba(0, 0, 0, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px;
    }
    #menu[hidden] { display: none; }
    #menu h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 4px; }
    #menu .hint { color: #aaa; margin: 0 0 16px; font-size: 14px; }
    #players { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 240px; }
    .player {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 4px; border-radius: 12px; border: 2px solid #555;
      background: #222; color: #fff; font-size: 18px; cursor: pointer;
    }
    .player .best { font-size: 12px; color: #f0d000; }
    .player.selected { border-color: #00f0f0; background: #003c3c; }
    #start {
      margin-top: 20px; width: 100%; max-width: 240px; height: 52px;
      font-size: 18px; font-weight: bold; border: none; border-radius: 12px;
      background: #00c060; color: #fff; cursor: pointer;
    }
    #start:disabled { background: #444; color: #999; cursor: default; }
    #ranking { margin-top: 16px; width: 100%; max-width: 240px; font-size: 14px; }
    #ranking .title { color: #f0d000; font-weight: bold; margin-bottom: 6px; text-align: center; }
    #ranking .title small { color: #888; font-weight: normal; }
    #ranking .row { display: flex; justify-content: space-between; padding: 3px 8px; border-bottom: 1px solid #333; }

    /* 터치 버튼 */
    #controls { display: none; gap: 8px; margin-top: 12px; width: 100%; max-width: 420px; padding: 0 12px; }
    #controls button {
      flex: 1; height: 64px; font-size: 26px; color: #fff;
      background: #2a2a2a; border: 1px solid #555; border-radius: 12px;
      touch-action: none;
    }
    #controls button:active { background: #444; }

    /* 터치 기기(손가락 입력)에서만: 버튼 표시, 패널을 작게 */
    @media (pointer: coarse) {
      #controls { display: flex; }
      #keys { display: none; }
      #info { font-size: 16px; margin-left: 10px; }
      #info p { margin-bottom: 10px; }
      #next { width: 72px; height: 72px; }
      #volume { width: 72px; }
      #pause, #music { width: 80px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <h1 id="title"><span class="flower">🌸</span> 꽃순이네 테트리스 <span class="flower">🌸</span></h1>
  <div id="game">
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <!-- 시작 화면: 보드 위에 겹쳐서 표시 -->
      <div id="menu">
        <h1>TETRIS</h1>
        <p class="hint">선수를 고르세요</p>
        <div id="players"></div>
        <button id="start" disabled>선수를 고르세요</button>
        <div id="ranking"></div>
      </div>
    </div>
    <div id="info">
      <p><span class="label">NEXT</span><canvas id="next"></canvas></p>
      <p><span class="label">점수</span><span id="score">0</span></p>
      <p><span class="label" id="best-label">최고 점수</span><span id="best">0</span></p>
      <p><span class="label">레벨</span><span id="level">1</span></p>
      <p><span class="label">줄</span><span id="lines">0</span></p>
      <p><button id="pause">⏸ 일시정지</button></p>
      <p><button id="music">🎵 음악 ON</button></p>
      <p>
        <span class="label">볼륨 <span id="volume-label">70</span></span>
        <input type="range" id="volume" min="0" max="100" value="70">
      </p>
      <div id="keys">
        ← → 이동<br>
        ↑ 회전<br>
        ↓ 한 칸 내리기<br>
        Space 하드 드롭<br>
        M 소리 켜기/끄기<br>
        P 일시정지<br>
        B 음악 켜기/끄기
      </div>
    </div>
  </div>
  <div id="controls">
    <button data-action="left">◀</button>
    <button data-action="right">▶</button>
    <button data-action="rotate">↻</button>
    <button data-action="down">▼</button>
    <button data-action="hardDrop">⤓</button>
  </div>
  <script src="music.js?v=15"></script>
  <script src="tetris.js?v=15"></script>
  <script type="module" src="ranking.js?v=15"></script>
</body>
</html>
